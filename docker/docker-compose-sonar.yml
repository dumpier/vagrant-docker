version: '3'
services:
  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonar
    depends_on:
      - postgres
      - sonar-init
    ports:
      - "9900:9000"
    tty: true
    networks:
      app_net:
        ipv4_address: 172.24.0.111
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - /vagrant/docker-data/sonarqube/data:/opt/sonarqube/data
      - /vagrant/docker-data/sonarqube/extensions:/opt/sonarqube/extensions
      - /vagrant/docker-data/sonarqube/logs:/opt/sonarqube/logs
      - /vagrant/docker-data/sonarqube/temp:/opt/sonarqube/temp

  postgres:
    image: postgres:10
    container_name: postgres
    tty: true
    networks:
      app_net:
        ipv4_address: 172.24.0.112
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - /vagrant/docker-data/postgresql:/var/lib/postgresql
      - /vagrant/docker-data/postgresql_data:/var/lib/postgresql/data

networks:
  app_net:
    driver: bridge
    ipam:
     driver: default
     config:
       - subnet: 172.24.0.0/24
